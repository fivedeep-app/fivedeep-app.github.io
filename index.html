<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Five Deep">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Five Deep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one-column gym logbook in team red and silver. Big tap targets, today's lifts as stacked cards, rest timer pinned to the bottom, progress dashboard as its own tab. */
:root{
  --bg:#eceef1; --surface:#ffffff; --ink:#16181b; --muted:#5d636b; --line:#cfd3d8;
  --accent:#c8102e; --accent-ink:#ffffff; --on-miss:#ffffff; --ring:#3a3f45; --silver:#8a9099; --good:#1f7a45; --miss:#b45309; --soft:#dfe2e6;
  --display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121315; --surface:#1c1e21; --ink:#eceef1; --muted:#a2a8b0; --line:#2f3236;
  --accent:#e8384f; --accent-ink:#ffffff; --on-miss:#16181b; --ring:#ffffff; --silver:#b8bec6; --good:#4cc283; --miss:#f0a050; --soft:#25282c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121315; --surface:#1c1e21; --ink:#eceef1; --muted:#a2a8b0; --line:#2f3236;
  --accent:#e8384f; --accent-ink:#ffffff; --on-miss:#16181b; --ring:#ffffff; --silver:#b8bec6; --good:#4cc283; --miss:#f0a050; --soft:#25282c; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 140px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:8px 4px}
h1 .d{color:var(--silver)}
h1 .f{color:var(--accent)}
h1{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1}
.who{color:var(--muted);font-size:14px}
nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;background:var(--soft);border-radius:12px;padding:4px;margin-block:12px 16px}
nav button{font:600 14px var(--body);border:0;background:transparent;color:var(--muted);padding:10px 0;border-radius:9px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.label{font:700 12px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.dayhead{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:12px}
.daytype{font-family:var(--display);font-weight:800;font-size:44px;line-height:.9;text-transform:uppercase}
.daytype span{color:var(--accent)}
.note{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--ink);margin-bottom:14px}
.lift{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.lifttop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.liftname{font-family:var(--display);font-weight:700;font-size:24px;text-transform:uppercase;letter-spacing:.02em}
.vid{display:inline-block;margin-top:2px;font-size:14px;color:var(--accent);font-weight:600;text-decoration:none;white-space:nowrap}
.vid:hover{text-decoration:underline}
.vrow{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:500}
.vrow:first-of-type{border-top:0}
.scheme{color:var(--muted);font-size:14px;font-weight:500}
.wt{display:flex;align-items:center;gap:6px}
.wt output{font-family:var(--display);font-weight:800;font-size:30px;min-width:4ch;text-align:right;font-variant-numeric:tabular-nums}
.wt small{color:var(--muted);font-weight:600;margin-left:2px}
.step{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:700 20px var(--body);cursor:pointer;line-height:1}
.plates{font-size:13px;color:var(--muted);margin:4px 0 10px;font-variant-numeric:tabular-nums}
.fails{color:var(--miss);font-weight:600}
.sets{display:flex;gap:8px;flex-wrap:wrap}
.set{width:54px;height:54px;border-radius:50%;border:3px solid var(--ring);background:transparent;color:var(--muted);font:800 22px var(--display);cursor:pointer;font-variant-numeric:tabular-nums}
.set.done{border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink)}
.set.miss{border:2px solid var(--miss);background:transparent;color:var(--miss)}
.btn{display:block;width:100%;font:700 17px var(--body);border:0;border-radius:12px;padding:15px;background:var(--accent);color:var(--accent-ink);cursor:pointer;margin-top:6px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--miss);color:var(--on-miss)}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.confirm{border:2px solid var(--miss);border-radius:14px;padding:14px;margin-top:10px;background:var(--surface)}
.timer{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--bg);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:20}
.timer .in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.timer .t{font:800 34px var(--display);font-variant-numeric:tabular-nums;line-height:1}
.timer .msg{font-size:14px;opacity:.85}
.timer button{font:700 14px var(--body);border:1px solid currentColor;background:transparent;color:inherit;border-radius:10px;padding:8px 12px;cursor:pointer}
.timer.up{background:var(--good);color:#fff}
.hist{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.hist h3{margin:0 0 6px;font:700 18px var(--display);text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
.hist h3 span{color:var(--muted);font:500 14px var(--body);text-transform:none}
.hl{display:flex;justify-content:space-between;gap:8px;font-size:15px;padding:3px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.hl:first-of-type{border-top:0}
.ok{color:var(--good);font-weight:600}.bad{color:var(--miss);font-weight:600}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
fieldset{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 14px;background:var(--surface)}
legend{font:700 13px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:0 6px}
.field{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:7px 0}
.field label{font-weight:500}
.field input{width:96px;font:600 17px var(--body);padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-align:right}
.field input[type=text]{width:160px;text-align:left}
textarea{width:100%;min-height:110px;font:13px ui-monospace,Menlo,monospace;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px}
.small{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:30}
/* progress dashboard */
.review{border:2px solid var(--accent)}
.rv{padding:8px 0;border-top:1px solid var(--line)}
.rvtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rv:first-of-type{border-top:0}
.terms p{margin:0 0 10px;font-size:15px;line-height:1.5}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 0;font-weight:500;border-top:1px solid var(--line)}
.chk input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--accent)}
.err{color:var(--accent);font-weight:600;font-size:14px;margin:4px 0 0}
.bwin .row input{font:600 18px var(--body);padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0}
.bwlog{margin-top:10px}.bwlog summary{cursor:pointer;font-weight:600;font-size:14px;padding:6px 0}
.linkbtn{border:0;background:none;color:var(--muted);font:500 13px var(--body);text-decoration:underline;cursor:pointer;margin-left:6px}
.comeback{border:2px solid var(--accent);background:var(--surface)}
.moves{margin:6px 0 10px;padding-left:20px;font-size:16px;line-height:1.5}
.moves li{margin:2px 0}
.wod h2{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:2px}
.wod .fmt{font:600 14px var(--body);color:var(--muted);text-transform:none;letter-spacing:0}
.wod.monthly{border:2px solid var(--silver)}
.warn{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px}
.wodclock{text-align:center}
.wodclock .moves{text-align:left;display:inline-block;margin:14px 0}
.wbig{font:800 96px/1 var(--display);font-variant-numeric:tabular-nums;margin:6px 0 4px}
.wsub{font-size:16px;color:var(--muted);font-weight:500}
.wtask{font:800 28px/1.2 var(--display);letter-spacing:.04em;min-height:34px;text-transform:uppercase}
.wtask.go{color:var(--accent)}.wtask.rest{color:var(--muted)}
.btn.big{font-size:22px;padding:20px;margin-top:14px}
.wrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.wrow>div{min-width:0}.wrow .chip{white-space:nowrap}
.mtag{font:600 12px var(--body);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 10px;white-space:nowrap}
.mtag.on{color:var(--accent);border-color:var(--accent)}
.wodlist summary{cursor:pointer;font:700 20px var(--display);text-transform:uppercase;letter-spacing:.03em}
.lvl{display:flex;gap:18px;flex-wrap:wrap;padding:10px 0;font-weight:500}
.lvl input{accent-color:var(--accent);width:18px;height:18px;vertical-align:-3px;margin:0 4px 0 0}
.tin{display:flex;align-items:center;gap:4px}.field .tin input{width:64px}
.cal button.wd{background:var(--soft);color:var(--ink);box-shadow:inset 0 0 0 2px var(--silver);cursor:pointer;font-weight:700}
.cal button.wd small{font:700 10px var(--body)}
.mvrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 10px}
.mv{font:600 13px var(--body);color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:5px 10px;text-decoration:none;white-space:nowrap}
.mv:hover{border-color:var(--accent)}
.extag{font:700 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--silver);border-radius:999px;padding:3px 9px}
.hdr{display:flex;align-items:center;gap:10px;min-width:0}
.hdr .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40vw}
.help{width:32px;height:32px;flex:none;border-radius:50%;border:1.5px solid var(--silver);background:transparent;color:var(--ink);font:700 16px var(--body);cursor:pointer;line-height:1}
.help:hover{border-color:var(--accent);color:var(--accent)}
.guide h2{margin-top:2px}
.guide ol{margin:4px 0 14px;padding-left:22px}
.guide li{margin:0 0 12px}
.guide li::marker{font:800 18px var(--display);color:var(--accent)}
.guide h3{font:700 18px var(--display);text-transform:uppercase;letter-spacing:.03em;margin:0 0 2px}
.guide p{margin:0;font-size:15px;line-height:1.5}
.set.picking{outline:3px solid var(--ink);outline-offset:2px}
.repick{margin-top:12px;padding:10px 12px;background:var(--soft);border-radius:12px}
.rphead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rphead .linkbtn{margin:0;padding:4px 0}
.rp{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:8px}
.rpb{min-width:0;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:800 20px var(--display);cursor:pointer}
.rpb.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rpb.clr{font:600 14px var(--body);padding:0 12px}
.timer .tip{opacity:1;font-weight:600;margin-top:4px}
.backup{border:2px solid var(--silver);background:var(--surface)}
.share{display:flex;gap:14px;align-items:center}
.share img{width:150px;height:150px;flex:none;border-radius:10px;background:#fff;padding:6px}
.share>p{min-width:0}
.shareurl{margin:10px 0 0;font-weight:700;font-size:17px;white-space:nowrap}
@media (max-width:360px){.share{flex-direction:column;align-items:flex-start}}
.erasebox{border:2px solid var(--miss);border-radius:12px;padding:12px 14px}
.erasein{width:100%;font:700 18px var(--body);letter-spacing:.08em;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.install{border:2px solid var(--accent);background:var(--surface);border-radius:14px;padding:12px 14px;margin:12px 0 14px}
.install ol{margin:8px 0 0;padding-left:22px;line-height:1.5}
.install li{margin:2px 0}
.feel{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.fb{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{font:600 14px var(--body);border:2px solid var(--silver);background:transparent;color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer}
.fbtn.easy.on{background:var(--good);border-color:var(--good);color:var(--on-miss)}
.fbtn.moderate.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.fbtn.difficult.on{background:var(--miss);border-color:var(--miss);color:var(--on-miss)}
.feelt.easy{color:var(--good);font-weight:600}.feelt.difficult{color:var(--miss);font-weight:600}.feelt.moderate{font-weight:600}
.eqtoday{margin:0 0 14px}
.eqsw{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--soft);border-radius:12px;padding:4px}
.eqb{font:700 16px var(--body);border:0;background:transparent;color:var(--muted);padding:11px 0;border-radius:9px;cursor:pointer}
.eqb.on{background:var(--accent);color:var(--accent-ink)}
.last{font-size:14px;color:var(--ink);margin:6px 0 0}
.ver{text-align:center;font-size:13px;color:var(--muted);margin:18px 0 0}
.ver .linkbtn{margin:0;font-size:13px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.mbox{background:var(--surface);color:var(--ink);border-radius:16px;padding:18px;max-width:480px;width:100%;max-height:100%;overflow:auto;border:1px solid var(--line)}
.mbox h2{font:700 26px var(--display);text-transform:uppercase;margin:2px 0 10px}
.wn ul{margin:6px 0 14px;padding-left:20px;line-height:1.45}
.wn li{margin:4px 0}
.sample{border:1px dashed var(--silver);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:14px;color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tile .v{font:800 32px var(--display);line-height:1.05;font-variant-numeric:tabular-nums}
.tile .v.red{color:var(--accent)}
.tile .k{font-size:13px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.panel h2{font:700 20px var(--display);text-transform:uppercase;letter-spacing:.03em;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{font:600 13px var(--body);border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 11px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.lt{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(3,minmax(0,1fr));gap:6px 8px;font-size:15px;font-variant-numeric:tabular-nums;align-items:baseline}
.lt .h{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.lt .n{text-align:right}
.up{color:var(--good);font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal .dw{font-size:11px;color:var(--muted);font-weight:600;padding-bottom:2px}
.cal button{aspect-ratio:1;max-width:100%;border:0;border-radius:9px;background:var(--bg);color:var(--muted);font:500 14px var(--body);cursor:default;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;line-height:1.05}
.cal button.w{background:var(--accent);color:var(--accent-ink);cursor:pointer;font-weight:700}
.cal button.w small{font:700 10px var(--body);opacity:.9}
.cal button.today{outline:2px solid var(--silver);outline-offset:-2px}
.cal button.sel{outline:3px solid var(--ink);outline-offset:-3px}
.calnav{display:flex;gap:6px}
.calnav button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);font:700 16px var(--body);cursor:pointer}
@media (max-width:360px){
  .liftname{font-size:20px}
  .wt{gap:4px}.wt output{font-size:26px;min-width:3ch}
  .step{width:32px;height:32px;font-size:18px}
  .set{width:46px;height:46px;font-size:20px}
  .sets{gap:6px}
  nav button{font-size:12px}
  .wbig{font-size:80px}
}
@media (prefers-reduced-motion:no-preference){.set{transition:background .12s,border-color .12s}}
</style>
</head>
<body>


<div class="wrap">
  <header><h1><span class="f">Five</span> <span class="d">Deep</span></h1><div class="hdr"><div class="who" id="who"></div><button class="help" id="helpBtn" aria-label="How to use Five Deep">?</button></div></header>
  <div id="installBar" hidden></div>
  <nav role="tablist">
    <button role="tab" id="tab-today" aria-selected="true" data-view="today">Today</button>
    <button role="tab" id="tab-wod" aria-selected="false" data-view="wod">WOD</button>
    <button role="tab" id="tab-progress" aria-selected="false" data-view="progress">Progress</button>
    <button role="tab" id="tab-history" aria-selected="false" data-view="history">History</button>
    <button role="tab" id="tab-settings" aria-selected="false" data-view="settings">Settings</button>
  </nav>
  <main id="view"></main>
</div>
<div class="timer" id="timer" hidden><div class="in"><div><div class="t" id="tclock">1:30</div><div class="msg" id="tmsg">Rest</div><div class="msg" id="tend"></div><div class="msg tip" id="ttip" hidden>Keep the app open and turn off auto-lock so you hear the beep.</div></div><button id="tskip">Skip rest</button></div></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const APP_NAME="Five Deep";
const APP_VERSION="1.3", APP_DATE="2026-10-28T12:00:00";
const CHANGELOG=[
 {v:"1.3",d:"2026-10-28T12:00:00",items:[
  "Rest timer now grows with the weight: 1:30 under 135 lb, up to 4:00 at 315 lb and over, plus a minute after a missed set.",
  "Each lift shows what you did last time, so you know where you're starting.",
  "New Barbell / Dumbbells switch at the top of Today, with dumbbell versions and videos for all five lifts.",
  "Rate each lift Easy, Moderate, or Difficult. The Next session card uses it to suggest what to do next.",
  "The − and + buttons now move 5 lb per tap.",

    const changed=[];
    Object.keys(LIFTS).forEach(k=>{ const w=v("w-"+k); if(w>0&&w!==S.lifts[k].w){ S.lifts[k].w=w; S.lifts[k].fails=0; changed.push(k) } });
    S.settings.restAuto=$("#s-restAuto").checked;

function restore(txt){

function allWods(){ return [...WODS,MONTHLY.fran,MONTHLY.grace] }
function wodById(id){ return allWods().find(w=>w.id===id) }
function fmtLabel(w){ return w.fmt==="amrap"?`${w.min} min AMRAP`:w.fmt==="emom"?`${w.min} min EMOM`:w.fmt==="tabata"?`Tabata, ${w.blocks.length*4} min`:w.fmt==="intervals"?`${w.reps} intervals`:"For time" }
function weekKey(d){ d=new Date(d); return dayKey(new Date(d.getFullYear(),d.getMonth(),d.getDate()-((d.getDay()+6)%7))) }
function monthKey(d){ d=new Date(d); return d.getFullYear()+"-"+(d.getMonth()+1) }
function monthChallenge(d){ d=new Date(d||Date.now()); return ((d.getFullYear()*12+d.getMonth())%2===0)?MONTHLY.fran:MONTHLY.grace }
function wodsThisWeek(){ const k=weekKey(new Date()); return (S.wods||[]).filter(x=>weekKey(x.date)===k) }
function mmss(sec){ sec=Math.max(0,Math.round(sec)); return Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0") }
function scoreText(x){ const s=x.score;
  let t= s.type==="rounds"?`${s.rounds} rounds + ${s.reps} reps`: s.type==="time"?mmss(s.sec): s.type==="minutes"?`${s.done} of ${s.of} minutes`: s.type==="lowest"?`${s.reps} reps in lowest round`: s.type==="splits"?`${mmss(s.avg)} avg per rep`:"";
  if(x.weight) t+=` at ${x.weight} lb`; return t+(x.level==="Scaled"?" (easier)":"") }
function better(a,b){ const s=a.score,t=b.score; if(s.type!==t.type) return false;
  if(s.type==="rounds") return s.rounds*1000+s.reps>t.rounds*1000+t.reps;
  if(s.type==="time") return s.sec<t.sec; if(s.type==="splits") return s.avg<t.avg;
  if(s.type==="minutes") return s.done>t.done; if(s.type==="lowest") return s.reps>t.reps; return false }
function bestFor(id,list){ const xs=(list||S.wods||[]).filter(x=>x.id===id), rx=xs.filter(x=>x.level!=="Scaled"), pool=rx.length?rx:xs; return pool.reduce((b,x)=>!b||better(x,b)?x:b,null) }
function suggestedWod(){

  S.wodPick={week:wk,id:pick.id}; save(); return pick }

let wodInt=null, wodKey=null;
function wodPhase(){
  const r=S.wodRun, w=wodById(r.id), now=Date.now();
  if(now<r.start) return {key:"ready",big:String(Math.ceil((r.start-now)/1000)),sub:"Get ready",task:""};
  const e=(now-r.start)/1000;
  if(w.fmt==="amrap"){ const left=w.min*60-e; if(left<=0) return {end:true}; return {key:"run",big:mmss(Math.ceil(left)),sub:"Time left. Keep count of your rounds.",task:"GO"} }
  if(w.fmt==="emom"){ if(e>=w.min*60) return {end:true}; const mi=Math.floor(e/60); return {key:"m"+mi,big:String(Math.ceil(60-(e%60))),sub:`Minute ${mi+1} of ${w.min}`,task:w.emom[mi%w.emom.length]} }
  if(w.fmt==="tabata"){ const blk=240; if(e>=w.blocks.length*blk) return {end:true}; const b=Math.floor(e/blk), wi=e%blk, rd=Math.floor(wi/30)+1, inr=wi%30, work=inr<20;
    return {key:`t${b}-${rd}-${work}`,big:String(Math.ceil(work?20-inr:30-inr)),sub:`${w.blocks[b]} · Round ${rd} of 8`,task:work?"WORK":"REST"} }
  if(w.fmt==="time") return {key:"run",big:mmss(Math.floor(e)),sub:"Tap Done the moment you finish.",task:"GO",canDone:true};
  if(w.fmt==="intervals"){ const n=r.splits.length;
    if(r.restUntil&&now<r.restUntil) return {key:"rest"+n,big:String(Math.ceil((r.restUntil-now)/1000)),sub:`Rest. Rep ${n+1} of ${w.reps} is next.`,task:"REST"};
    return {key:"rep"+n,big:mmss(Math.floor((now-r.repStart)/1000)),sub:`Rep ${n+1} of ${w.reps}`,task:"RUN",canRep:true} }
}
function wodTick(){
  if(!S.wodRun){ stopWodClock(); return }
  if(tab!=="wod") return;
  const p=wodPhase();
  if(p.end){ finishClock(); return }
  if(wodKey!==null&&p.key!==wodKey) beep();
  wodKey=p.key;
  const c=$("#wclock"); if(!c) return;
  c.textContent=p.big; $("#wsub").textContent=p.sub;
  const t=$("#wtask"); t.textContent=p.task||""; t.className="wtask"+(p.task==="REST"?" rest":p.task?" go":"");
  const rb=$("#wRep"); if(rb) rb.hidden=!p.canRep;
  const db=$("#wDone"); if(db) db.hidden=!p.canDone;
}
function startWodClock(){ clearInterval(wodInt); wodKey=null; wodTick(); wodInt=setInterval(wodTick,200) }

function startWod(id){ unlockAudio(); wake(); const t=Date.now()+10000; S.wodRun={id,start:t,splits:[],restUntil:0,repStart:t}; save(); confirmMode=null; renderWod(); window.scrollTo(0,0) }
function finishClock(){
  const r=S.wodRun; if(!r) return;
  S.wodScore={id:r.id,auto:true,elapsed:Math.max(0,(Date.now()-r.start)/1000),splits:r.splits||[]};
  S.wodRun=null; save(); beep(); stopWodClock(); confirmMode=null; renderWod(); window.scrollTo(0,0) }
function repDone(){
  const r=S.wodRun, w=wodById(r.id), now=Date.now(); if(now<r.start||(r.restUntil&&now<r.restUntil)) return;
  r.splits.push((now-r.repStart)/1000);

  r.restUntil=now+w.rest*1000; r.repStart=r.restUntil; save(); wodTick() }

function scoreFormHTML(){

  return `<section class="panel review"><h2>Log your ${esc(w.name)}</h2><p class="small" style="margin:-4px 0 8px">${intro}</p>${f}

function saveScore(){
  const sc=S.wodScore, w=wodById(sc.id), num=id=>{ const el=$("#"+id); return el&&el.value!==""?parseFloat(el.value):NaN };

  if(w.fmt==="tabata"){ const l=num("sc-l"); if(!(l>=0)) return err("Enter the reps from your lowest round."); score={type:"lowest",reps:Math.floor(l)} }
  if(w.fmt==="time"||(w.fmt==="intervals"&&!sc.splits.length)){ const mm=num("sc-mm"), ss=num("sc-ss"), t=(mm>0?mm:0)*60+(ss>0?ss:0);

  if(w.fmt==="intervals"&&sc.splits.length){ const avg=sc.splits.reduce((a,b)=>a+b,0)/sc.splits.length; score={type:"splits",avg:Math.round(avg),splits:sc.splits.map(Math.round)} }

  const prev=bestFor(w.id);
  S.wods=S.wods||[]; S.wods.push(entry); S.wodScore=null; save();

    ${[MONTHLY.fran,MONTHLY.grace].map(w=>{ const b=bestFor(w.id), now=ch.id===w.id;
      const nx=new Date(); nx.setDate(1); nx.setMonth(nx.getMonth()+1); const nextName=nx.toLocaleDateString(undefined,{month:"long"});
      return `<div class="wrow"><div><b>${w.name}</b> <span class="small">${fmtLabel(w)}</span><div class="small">${w.id==="fran"?"21-15-9 thrusters and strict pull-ups":"30 clean and jerks"}</div><span></span><div class="small">${b?"Best: "+scoreText(b):"Not done yet"}</div></div><span class="mtag${now?" on":""}">${now?(chDone?"Done this month":"This month"):"Next: "+nextName}</span></div>` }).join("")}</details>`;
  h+=`<section class="panel"><h2>Movement videos</h2><p class="small" style="margin:-4px 0 6px">Short demos, mostly from CrossFit. All pull-ups in Five Deep are strict: dead hang, chin over the bar, no swinging. Not there yet? Loop a resistance band over the bar and under your foot or knee. Use a lighter band as you get stronger. Learn the clean and jerk from a coach.</p>
    ${Object.keys(MOVES).map(k=>`<a class="vrow" href="${ytURL(MOVES[k].yt)}" target="_blank" rel="noopener"><span>${MOVES[k].name}</span><span class="vid">Watch ▶</span></a>`).join("")}</section>`;
  const log=(S.wods||[]).slice(-5).reverse();
  if(log.length) h+=`<section class="panel"><h2>Recent WODs</h2>${log.map(x=>`<div class="hl"><span>${fmtD(x.date)} · ${esc(wodById(x.id).name)}</span><span>${scoreText(x)}</span></div>`).join("")}</section>`;
  view.innerHTML=h }
view.addEventListener("click",e=>{
  if(tab!=="wod") return;
  const st=e.target.closest("[data-start]"); if(st){ if(wodsThisWeek().length<1) startWod(st.dataset.start); return }
  const lg=e.target.closest("[data-log]"); if(lg){ if(wodsThisWeek().length<1){ S.wodScore={id:lg.dataset.log,auto:false,splits:[]}; save(); renderWod(); window.scrollTo(0,0) } return }
  const pk=e.target.closest("[data-pick]"); if(pk){ S.wodPick={week:weekKey(new Date()),id:pk.dataset.pick}; save(); renderWod(); window.scrollTo(0,0); return }
  const id=e.target.id;
  if(id==="wodShuffle"){ const cur=suggestedWod().id, pool=WODS.filter(w=>!w.special&&w.id!==cur); S.wodPick={week:weekKey(new Date()),id:pool[Math.floor(Math.random()*pool.length)].id}; save(); renderWod() }
  if(id==="wDone") finishClock();
  if(id==="wRep") repDone();
  if(id==="wEnd"){ confirmMode="wend"; renderWod() }
  if(id==="wKeep"){ confirmMode=null; renderWod() }
  if(id==="wEndNow"){ confirmMode=null; finishClock() }
  if(id==="scSave") saveScore();
  if(id==="scToss"){ S.wodScore=null; save(); renderWod(); window.scrollTo(0,0) }
});
view.addEventListener("input",e=>{ if(tab==="wod"){ const er=$("#scErr"); if(er) er.hidden=true } });

function shareApp(){
  const copy=()=>{ const t=SHARE_TEXT+" "+SHARE_URL;
    try{ navigator.clipboard.writeText(t).then(()=>toast("Link copied. Paste it into a text."),()=>toast("Send them: "+SHARE_URL)) }catch(e){ toast("Send them: "+SHARE_URL) } };
  try{ if(navigator.share){ navigator.share({title:"Five Deep",text:SHARE_TEXT,url:SHARE_URL}).catch(e=>{ if(e&&e.name!=="AbortError") copy() }); return } }catch(e){}
  copy() }

// Shown only when Five Deep is opened in a browser tab instead of from the home screen.
let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); deferredPrompt=e; renderInstall() });
window.addEventListener("appinstalled",()=>{ deferredPrompt=null; renderInstall(); toast("Installed. Open Five Deep from your home screen.") });
function isStandalone(){ try{ return window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true }catch(e){ return false } }
function phoneType(){ const ua=navigator.userAgent||"";
  if(/FBAN|FBAV|FB_IAB|Instagram|Snapchat|Line\/|LinkedInApp/.test(ua)) return "inapp";
  if(/iPhone|iPad|iPod/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1)) return "ios";
  if(/Android/.test(ua)) return "android"; return "other" }
const SHARE_ICON=`<svg viewBox="0 0 24 24" width="18" height="18" aria-label="Share" role="img" style="vertical-align:-3px"><path d="M12 3v12M8 7l4-4 4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 10H5v11h14V10h-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>`;
function renderInstall(){
  const bar=$("#installBar"); if(!bar) return;
  let embedded=false; try{ embedded=window.self!==window.top }catch(e){ embedded=true }
  const p=phoneType(), snoozed=S.installSnooze&&new Date(S.installSnooze)>new Date();
  if(isStandalone()||embedded||snoozed||(p==="other"&&!deferredPrompt)){ bar.hidden=true; bar.innerHTML=""; return }
  let body="";
  if(p==="inapp") body=`<p style="margin:6px 0 0">This page opened inside another app. Tap the <b>•••</b> menu and choose <b>Open in Safari</b> (or <b>Open in browser</b>). Then you'll see how to add Five Deep to your home screen.</p>`;
  else if(p==="ios") body=`<ol><li>Tap the <b>Share</b> button ${SHARE_ICON}. It's at the bottom of Safari, or the top right in Chrome.</li><li>Scroll down and tap <b>Add to Home Screen</b>.</li><li>Tap <b>Add</b>, then open Five Deep from the new icon.</li></ol>`;
  else if(deferredPrompt) body=`<p style="margin:6px 0 10px">One tap and it's on your home screen like any other app.</p><button class="btn" id="installNow" style="margin:0 0 4px">Install Five Deep</button>`;
  else body=`<ol><li>Tap the <b>⋮</b> menu at the top right of Chrome.</li><li>Tap <b>Install app</b> or <b>Add to Home screen</b>.</li><li>Open Five Deep from the new icon.</li></ol>`;
  bar.innerHTML=`<section class="install" aria-label="Add Five Deep to your home screen"><b>Add Five Deep to your home screen</b>${body}
    <p class="small" style="margin:6px 0 0">Do this before you log workouts. Anything logged here in the browser stays in the browser and won't move to the home screen app.</p>
    <button class="linkbtn" id="installLater" style="margin:8px 0 0">Not now</button></section>`;
  bar.hidden=false }

/* ---------- HOW TO USE ---------- */
let helpBack="today";
const GUIDE=[
 ["Set up","Go to Settings and enter your name and starting weights. Start light."],
 ["Lift","Tap each set as you finish it. The app picks your next weights."],
 ["WODs","Optional, one a week, on your days off from lifting."]
];
function renderHelp(){
  if(!S.guideSeen){ S.guideSeen=true; save() }
  view.innerHTML=`<section class="panel guide"><div class="label">How to use</div><h2>Five Deep in 30 seconds</h2>
    <ol>${GUIDE.map(([t,b])=>`<li><h3>${t}</h3><p>${b}</p></li>`).join("")}</ol>
    <button class="btn" id="helpDone">Got it</button>
    <p class="small" style="margin:10px 0 0;text-align:center">The app explains the rest as you go. Tap the ? next to the logo anytime to see this again.</p></section>`;
}
document.addEventListener("click",e=>{
  const id=e.target.id;
  if(id==="wnDone"){ S.seenVersion=APP_VERSION; save(); const m=$("#whatsNew"); if(m) m.remove(); return }
  if(id==="wnOpen"||id==="wnOpen2"){ showWhatsNew(true); return }
  if(id==="shareBtn"){ shareApp(); return }
  if(id==="installLater"){ S.installSnooze=new Date(Date.now()+7*864e5).toISOString(); save(); renderInstall(); return }
  if(id==="installNow"&&deferredPrompt){ const d=deferredPrompt; d.prompt(); Promise.resolve(d.userChoice).then(()=>{ deferredPrompt=null; renderInstall() }); return }
  if((id==="helpBtn"||id==="openHelp")&&S.ack){ if(tab!=="help") helpBack=tab; tab="help"; confirmMode=null; render(); window.scrollTo(0,0) }
  if(id==="helpDone"){ tab=helpBack||"today"; render(); window.scrollTo(0,0) }
});

/* ---------- ROUTING / EVENTS ---------- */
function renderHeader(){ $("#who").textContent=S.name?S.name:"" }
function render(){
  renderInstall();
  if(!S.ack){ renderTerms(); return }
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.view===tab));
  $("#helpBtn").hidden=false;
  if(tab==="help") renderHelp(); else if(tab==="today") renderToday(); else if(tab==="wod") renderWod(); else if(tab==="progress") renderProgress(); else if(tab==="history") renderHistory(); else renderSettings();
}
document.querySelector("nav").onclick=e=>{ const b=e.target.closest("button"); if(!b) return; tab=b.dataset.view; confirmMode=null; pick=null; render(); window.scrollTo(0,0) };
view.addEventListener("click",e=>{
  if(tab!=="today") return;
  const set=e.target.closest(".set");
  if(set){
    const li=+set.dataset.l, j=+set.dataset.s, L=S.current.lifts[li];
    if(L.sets[j]===null){ L.sets[j]=5; pick=null; save(); renderToday(); startTimer(restFor(L,true),restMsg(L,true)) }
    else { pick=(pick&&pick.l===li&&pick.j===j)?null:{l:li,j}; renderToday() }
    return;
  }
  const rp=e.target.closest("[data-reps]");
  if(rp&&pick){ const L=S.current.lifts[pick.l], v=rp.dataset.reps, st=S.settings;
    if(v==="clear"){ L.sets[pick.j]=null; pick=null; save(); renderToday(); stopTimer() }
    else { const n=+v; L.sets[pick.j]=n; pick=null; save(); renderToday(); startTimer(restFor(L,n===5),restMsg(L,n===5)) }
    return }
  if(e.target.id==="bkLater"){ S.backupSnooze=new Date(Date.now()+3*864e5).toISOString(); save(); renderToday(); return }
  if(e.target.id==="bkCopy"){ copyBackup(true); return }
  const eqb=e.target.closest("[data-equip]"); if(eqb){ switchEquip(eqb.dataset.equip); return }
  const adj=e.target.closest("[data-adj]");
  if(adj){ const L=S.current.lifts[+adj.dataset.adj]; L.w=Math.max(floorW(),L.w+parseFloat(adj.dataset.d)); save(); renderToday(); return }
  const fe=e.target.closest("[data-feel]");
  if(fe){ const L=S.current.lifts[+fe.dataset.feel]; L.feel=L.feel===fe.dataset.f?null:fe.dataset.f; save(); renderToday(); return }
  if(e.target.id==="finish"){ const all=S.current.lifts.every(L=>L.sets.every(r=>r!==null)); if(all) finishWorkout(); else { confirmMode="finish"; renderToday() } }
  if(e.target.id==="forceFinish") finishWorkout();
  if(e.target.id==="cancelFinish"){ confirmMode=null; renderToday() }
  if(e.target.id==="discardBtn"){ confirmMode="discard"; renderToday() }
  if(e.target.id==="cancelDiscard"){ confirmMode=null; renderToday() }
  if(e.target.id==="doDiscard"){ S.current=null; confirmMode=null; save(); stopTimer(); toast("Workout discarded"); renderToday(); window.scrollTo(0,0) }
  if(e.target.id==="breakKeep"){ S.breakAck=S.history[0].date; save(); renderToday() }
  if(e.target.id==="breakDrop"){
    Object.keys(LIFTS).forEach(k=>{ S.lifts[k].w=round5(S.lifts[k].w*0.9); S.lifts[k].fails=0 });
    if(S.current) S.current.lifts.forEach(L=>L.w=S.lifts[L.key].w);
    S.breakAck=S.history[0].date; save(); toast("Weights dropped 10%"); renderToday() }
});

if(S.wodRun||S.wodScore) tab="wod";
renderHeader(); render(); maybeWhatsNew();
if("serviceWorker" in navigator && window.isSecureContext && !/claude/.test(location.hostname)){
  try{
    // When a new version takes over, reload once so the update shows right away. Workouts are saved, so nothing is lost.
    const hadOld=!!navigator.serviceWorker.controller; let reloaded=false;
    navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(hadOld&&!reloaded){ reloaded=true; location.reload() } });
    navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).catch(()=>{})
  }catch(e){}
}
})();
</script>
